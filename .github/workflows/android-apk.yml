name: Android demo APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout Nabih
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Generate compatible Expo project
        run: |
          npx --yes create-expo-app@latest build-app --template blank --yes
          cp App.js build-app/App.js
          cp app.json build-app/app.json
      - name: Generate Android native project
        working-directory: build-app
        run: npx expo prebuild --platform android --non-interactive
      - name: Build debug APK
        working-directory: build-app/android
        run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nabih-Android-Demo-APK
          path: build-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
